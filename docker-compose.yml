services:
  frontend:
    build:
      context: frontend
    env_file:
      - frontend/.env
    command: sh -c "rm -rf /dist/* && cp -r /app/frontend/dist/. /dist && tail -f /dev/null"
    volumes:
      - frontend:/dist

  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - db:/data/db
    ports:
      - 27018:27017
    networks:
      - internal

  backend:
    restart: always
    build:
      context: backend
    environment:
      PORT: 3000
      DB_ADDRESS: mongodb://root:example@mongo:27017/weblarek?authSource=admin
      UPLOAD_PATH: images
      UPLOAD_PATH_TEMP: temp
      ORIGIN_ALLOW: http://localhost:5173
      AUTH_ACCESS_TOKEN_EXPIRY: 15m
      AUTH_REFRESH_TOKEN_EXPIRY: 7d
      RATE_LIMITED: "true"
      RATE_LIMIT_POINTS: 3
      RATE_LIMIT_DURATION: 5
      RATE_LIMIT_BLOCK: 15
    command: npm run start
    volumes:
      - ./backend/src:/app/src
      - public:/app/src/public
    ports:
      - 3000:3000
    networks:
      - internal
    depends_on:
      - mongo

  server:
    build:
      context: nginx
    ports:
      - 80:80
    volumes:
      - frontend:/var/app
      - public:/var/public
    depends_on:
      - frontend
      - backend
    networks:
      - internal

volumes:
  frontend:
  public:
  db:

networks:
  internal: